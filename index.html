<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <title>Sephora Thailand</title>
    
    <!-- DNS prefetch & Preconnect for external resources -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="preconnect" href="https://images.unsplash.com" />
    <link rel="dns-prefetch" href="https://upload.wikimedia.org" />

    <!-- Favicon and App Icons -->
    <link rel="icon" type="image/png" sizes="32x32" href="/sephora.png?v=2" />
    <link rel="icon" type="image/png" sizes="16x16" href="/sephora.png?v=2" />
    <link rel="icon" type="image/svg+xml" href="/sephora.svg?v=2" />
    <link rel="shortcut icon" href="/sephora.png?v=2" />
    <link rel="apple-touch-icon" sizes="180x180" href="/sephora.png?v=2" />

    <!-- Open Graph / Facebook / LINE sharing meta tags -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Sephora Thailand" />
    <meta property="og:description" content="ช้อปสกินแคร์ เครื่องสำอาง น้ำหอม และบิวตี้ไอเทมยอดนิยมระดับโลกได้ที่ Sephora Thailand" />
    <meta property="og:image" content="https://ais-pre-gqghljcpxacus4prddvzdw-1047113194423.asia-southeast1.run.app/sephora.png" />
    <meta property="og:site_name" content="Sephora" />

    <!-- Twitter sharing meta tags -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Sephora Thailand" />
    <meta name="twitter:description" content="ช้อปสกินแคร์ เครื่องสำอาง น้ำหอม และบิวตี้ไอเทมยอดนิยมระดับโลกได้ที่ Sephora Thailand" />
    <meta name="twitter:image" content="https://ais-pre-gqghljcpxacus4prddvzdw-1047113194423.asia-southeast1.run.app/sephora.png" />
  </head>
  <body style="background-color: #fafafa; margin: 0; padding: 0; color: #171717;">
    <div id="root">
      <!-- Instant App Shell Skeleton: Displayed only before React hydrates (sub-100ms) -->
      <div style="min-height: 100vh; display: flex; flex-direction: column; font-family: system-ui, -apple-system, sans-serif;">
        <!-- Header Skeleton -->
        <div style="height: 60px; background: #ffffff; border-bottom: 1px solid #f0f0f0; display: flex; align-items: center; justify-content: space-between; padding: 0 16px;">
          <div style="display: flex; align-items: center; gap: 10px;">
            <div style="width: 36px; height: 36px; background: #f3f4f6; border-radius: 8px;"></div>
            <div style="width: 140px; height: 20px; background: #f3f4f6; border-radius: 4px;"></div>
          </div>
          <div style="width: 80px; height: 32px; background: #f3f4f6; border-radius: 9999px;"></div>
        </div>
        <!-- Banner Skeleton -->
        <div style="width: 100%; aspect-ratio: 3/1; max-height: 280px; background: linear-gradient(90deg, #f0f0f0 25%, #f8f8f8 50%, #f0f0f0 75%); background-size: 200% 100%;"></div>
        <!-- Body Cards Skeleton -->
        <div style="padding: 16px; display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px; max-width: 1280px; margin: 0 auto; width: 100%; box-sizing: border-box;">
          <div style="background: #ffffff; border-radius: 16px; height: 240px; border: 1px solid #f0f0f0;"></div>
          <div style="background: #ffffff; border-radius: 16px; height: 240px; border: 1px solid #f0f0f0;"></div>
        </div>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
